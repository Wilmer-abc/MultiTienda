<div class="min-h-screen bg-slate-100 flex flex-col md:flex-row">
  
  <header class="bg-blue-600 text-white px-4 py-3 flex justify-between items-center md:hidden shadow-md">
    <span class="font-bold tracking-tight text-lg">MultiTienda 🛒</span>
    <button (click)="logout()" class="p-2 bg-blue-700 active:bg-blue-800 rounded-lg text-sm transition-colors">
      Salir
    </button>
  </header>

  <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex-shrink-0 hidden md:flex flex-col border-r border-slate-800">
    <div class="p-6 border-b border-slate-800 bg-slate-950 flex flex-col">
      <span class="text-xl font-black text-white tracking-wide">MultiTienda</span>
      <span class="text-xs text-blue-400 font-medium mt-1 uppercase tracking-wider">Módulo de Tienda</span>
    </div>

      <nav class="flex-1 p-4 space-y-2">
        
        <a 
          routerLink="/dashboard/ventas" 
          routerLinkActive="bg-blue-600 text-white" 
          class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-all font-medium"
        >
          <span>🛍️</span>
          <span>Punto de Venta</span>
        </a>

        <ng-container *ngIf="usuarioLogueado?.rol === 'administrador' || usuarioLogueado?.rol === 'dueño'">
          
          <a 
            routerLink="/dashboard/productos" 
            routerLinkActive="bg-blue-600 text-white" 
            class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-all font-medium"
          >
            <span>📦</span>
            <span>Catálogo Global</span>
          </a>

          <a 
            routerLink="/dashboard/usuarios" 
            routerLinkActive="bg-blue-600 text-white" 
            class="flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition-all font-medium"
          >
            <span>👥</span>
            <span>Gestionar Personal</span>
          </a>

        </ng-container>
      </nav>

    <div class="p-4 border-t border-slate-800 bg-slate-950/50 flex flex-col space-y-3">
      <div class="flex flex-col">
        <span class="text-sm font-semibold text-white">{{ usuarioLogueado?.nombre || 'Usuario' }}</span>
        <span class="text-xs text-slate-400 capitalize">Rol: {{ usuarioLogueado?.rol }}</span>
      </div>
      <button 
        (click)="logout()" 
        class="w-full py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white text-sm font-medium rounded-lg border border-rose-500/30 transition-all duration-150 text-center"
      >
        Cerrar Sesión
      </button>
    </div>
  </aside>

  <main class="flex-1 p-4 md:p-8 overflow-y-auto">
    <div class="hidden md:flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-200/60">
      <h2 class="text-lg font-bold text-slate-700">Punto de Venta Activo • Tienda #{{ usuarioLogueado?.tiendaId }}</h2>
      <div class="text-sm text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg">
        Sesión iniciada como: <strong class="text-slate-700">{{ usuarioLogueado?.correo }}</strong>
      </div>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/60 min-h-[calc(100vh-12rem)]">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
