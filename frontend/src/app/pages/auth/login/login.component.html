<div class="min-h-screen bg-slate-50 flex flex-col justify-center items-center p-4 relative overflow-hidden font-sans">
  
  <!-- Elementos decorativos sutiles (Balanced Theme) -->
  <div class="absolute top-0 right-0 w-1/2 h-1/2 bg-blue-100/50 blur-[100px] rounded-full pointer-events-none"></div>
  <div class="absolute bottom-0 left-0 w-1/2 h-1/2 bg-indigo-100/50 blur-[100px] rounded-full pointer-events-none"></div>

  <!-- Tarjeta principal -->
  <div class="w-full max-w-md bg-white/80 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white p-8 sm:p-10 space-y-8 relative z-10">
    
    <!-- Header -->
    <div class="text-center space-y-4">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl mx-auto shadow-sm">
        <span class="material-icons text-2xl">storefront</span>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-slate-800 tracking-tight">
          Bienvenido a MultiTienda
        </h1>
        <p class="text-sm text-slate-500 mt-2">Ingresa tus credenciales para acceder</p>
      </div>
    </div>

    <!-- Mensaje de error general -->
    <div *ngIf="errorMensaje" class="bg-red-50/80 border border-red-100 rounded-xl p-4 animate-shake">
      <div class="flex items-start space-x-3">
        <span class="material-icons text-red-500 text-[20px]">error_outline</span>
        <div class="flex-1">
          <p class="text-sm font-medium text-red-800">{{ errorMensaje }}</p>
        </div>
        <button (click)="errorMensaje = null" class="text-red-400 hover:text-red-600">
          <span class="material-icons text-[18px]">close</span>
        </button>
      </div>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="ejecutarLogin()" class="space-y-6">
      
      <!-- Campo email -->
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">
          Correo Electrónico <span class="text-red-400">*</span>
        </label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <span class="material-icons text-[20px] text-slate-400 group-focus-within:text-blue-500 transition-colors">mail_outline</span>
          </div>
          <input 
            type="email" 
            name="correo"
            [(ngModel)]="credenciales.correo"
            (blur)="marcarTocado('correo'); validarCampo('correo')"
            (input)="validarCampo('correo')"
            placeholder="usuario@empresa.com" 
            [class.border-red-300]="touched.correo && erroresValidacion.correo"
            [class.border-green-300]="touched.correo && !erroresValidacion.correo && credenciales.correo"
            class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all duration-200 shadow-sm"
            required
          />
        </div>
        <div *ngIf="touched.correo && erroresValidacion.correo" class="flex items-center space-x-1 text-red-500 text-xs mt-1">
          <span>{{ erroresValidacion.correo }}</span>
        </div>
      </div>

      <!-- Campo password -->
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block">
          Contraseña <span class="text-red-400">*</span>
        </label>
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <span class="material-icons text-[20px] text-slate-400 group-focus-within:text-blue-500 transition-colors">lock_outline</span>
          </div>
          <input 
            [type]="mostrarPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="credenciales.password"
            (blur)="marcarTocado('password'); validarCampo('password')"
            (input)="validarCampo('password')"
            placeholder="••••••••" 
            [class.border-red-300]="touched.password && erroresValidacion.password"
            [class.border-green-300]="touched.password && !erroresValidacion.password && credenciales.password"
            class="w-full pl-11 pr-12 py-3 bg-white border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all duration-200 shadow-sm"
            required
          />
          <button 
            type="button"
            (click)="toggleMostrarPassword()"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
            tabindex="-1"
          >
            <span class="material-icons text-[20px]">{{ mostrarPassword ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
        <div *ngIf="touched.password && erroresValidacion.password" class="flex items-center space-x-1 text-red-500 text-xs mt-1">
          <span>{{ erroresValidacion.password }}</span>
        </div>
      </div>

      <!-- Botón submit -->
      <button 
        type="submit" 
        [disabled]="cargando"
        class="w-full py-3.5 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl shadow-md active:scale-[0.98] transition-all duration-200 disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2 mt-4"
      >
        <span *ngIf="!cargando" class="material-icons text-[20px]">login</span>
        <svg *ngIf="cargando" class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ cargando ? 'Verificando...' : 'Iniciar Sesión' }}</span>
      </button>

      <div class="text-center text-sm pt-2">
        <a href="#" class="text-slate-500 hover:text-blue-600 font-medium transition-colors">
          ¿Problemas para acceder?
        </a>
      </div>

    </form>
  </div>
  
  <div class="mt-8 text-center">
    <p class="text-xs text-slate-400 font-medium tracking-wide">MultiTienda OS © 2026</p>
  </div>
</div>
